spring:
  application:
    name: corporate-admin-panel

  datasource:
    url: jdbc:h2:mem:admin_panel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-key-of-at-least-32-bytes}
    expiration-ms: 86400000

logging:
  level:
    com.company.corporate_admin_panel: DEBUG
    org.springframework.security: INFO